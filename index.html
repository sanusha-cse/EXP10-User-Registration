<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <!-- Relative paths on purpose: they keep working under https://user.github.io/<repo>/ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== Registration form ===== -->
    <div class="container" id="formView">
        <div class="form-card">

            <div class="header">
                <div class="logo">✦</div>
                <h1>Create Your Account</h1>
                <p>Join us today! Enter your details below.</p>
            </div>

            <div class="error hidden" id="formError" role="alert"></div>

            <form id="registerForm">

                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name"
                           required minlength="3"
                           pattern="[A-Za-z ]+"
                           title="Letters and spaces only (min 3 characters)">
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@gmail.com"
                           required>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="10 digit phone number"
                           pattern="[0-9]{10}" required
                           title="Enter exactly 10 digits">
                </div>

                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="input-group">
                    <label for="course">Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="B.Tech IT">B.Tech IT</option>
                        <option value="B.Tech ECE">B.Tech ECE</option>
                        <option value="B.Tech AI & DS">B.Tech AI &amp; DS</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address"
                              placeholder="Enter your address"
                              required minlength="5"></textarea>
                </div>

                <button type="submit" id="submitBtn">Create Account →</button>

                <p class="footer-text">
                    Please fill in all the required details.
                </p>
                <p class="mode-note" id="modeNote"></p>

            </form>
        </div>
    </div>

    <!-- ===== Results view (shown after a successful registration) ===== -->
    <div class="container wide hidden" id="resultsView">
        <div class="form-card">
            <div class="header">
                <div class="logo">✓</div>
                <h1>Registration Successful!</h1>
                <p>Welcome to our registration portal.</p>
            </div>

            <div class="success" id="successMsg"></div>

            <h2 class="results-title" id="resultsTitle"></h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>DOB</th>
                            <th>Course</th>
                            <th>Address</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>

            <button type="button" class="back-btn" id="backBtn">← Register Another User</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
